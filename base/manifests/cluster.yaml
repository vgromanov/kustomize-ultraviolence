---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: ${clusterName}
  name: ${clusterName}
spec:
  clusterNetwork:
    services:
      cidrBlocks:
        - ${svcCIDR}
    pods:
      cidrBlocks:
        - ${podCIDR}
    serviceDomain: ${clusterFQDN}
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: placeholder
    name: ${clusterName}-cp
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: placeholder
    name: placeholder
