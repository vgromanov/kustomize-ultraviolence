name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  kustomize:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - samples/metal3
          - samples/vsphere
          - samples/kubevirt-kamaji
          - samples/kubevirt-kubeadm
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: "5.8.1"
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          kustomize version
      - name: kustomize build
        run: kustomize build "${{ matrix.path }}" > /dev/null
    # Deeper layout validation (checkpoints, inventory, trace) is done with kustomize-mcp locally per AGENTS.md
