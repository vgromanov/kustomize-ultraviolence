name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  kustomize:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - samples/metal3
          - samples/vsphere
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: v5.8.1
      - name: kustomize build
        run: kustomize build "${{ matrix.path }}" > /dev/null
    # Deeper layout validation (checkpoints, inventory, trace) is done with kustomize-mcp locally per AGENTS.md
