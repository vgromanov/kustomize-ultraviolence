# Local test harness: mirrors Flux (path /base + same spec.components as manifest).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${clusterName}
labels:
  - includeSelectors: true
    pairs:
      cluster.x-k8s.io/cluster-name: ${clusterName}
resources:
  - ../../base/manifests
components:
  - ../../_refs
  - ../../infra/kubevirt
  - ../../topologies/demo-kubevirt
  - ../../zones/north/kubevirt
  - ../../zones/south/kubevirt
  - ../../zones/east/kubevirt
  - ../../bootstrap/kubeadm/kubevirt
  - ../../control-plane/kubeadm/kubevirt
