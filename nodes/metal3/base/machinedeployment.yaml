---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: ${clusterName}
  name: mdw-0
spec:
  clusterName: ${clusterName}
  replicas: 0
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ${clusterName}
  rollout:
    strategy:
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: ${clusterName}
    spec:
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: placeholder
          name: placeholder
      clusterName: ${clusterName}
      deletion:
        nodeDrainTimeoutSeconds: 300
        nodeVolumeDetachTimeoutSeconds: 300
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: Metal3MachineTemplate
        name: ${clusterName}
      minReadySeconds: 300
      version: ${kubeVersion}
