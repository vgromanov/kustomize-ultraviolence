apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ../base
  - kubeadmconfigtemplate-ingress.yaml

components:
  - ../kubeadmconfigspec
  - hack-netplan
  - ignition
  - ../../../addons/ssh-keys

transformers:
  - ../_replacements/hack-netplan/
  - ../_replacements/ignition/
  - ../_replacements/kcs-to-kct/

patches:
  - target:
      kind: MachineDeployment
      annotationSelector: clusters.local/pool=worker
    path: patches/machinedeployment-worker.yaml
  - target:
      kind: ConfigMap
      name: (ignition|hack-netplan)
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          config.kubernetes.io/local-config: "true"