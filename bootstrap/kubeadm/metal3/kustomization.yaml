apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ../base

components:
  - ../kubeadmconfigspec
  - hack-netplan
  - ignition
  - ../../../addons/ssh-keys

transformers:
  - ../_replacements/hack-netplan/
  - ../_replacements/ignition/
  - transformers/
  - ../_replacements/kcs-to-kct/

patches:
  - target:
      kind: MachineDeployment
    path: patches/machinedeployment.yaml
