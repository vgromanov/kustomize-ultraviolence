storage:
  directories:
  - path: /opt/libexec
    mode: 0755
  - path: /opt/libexec.work
    mode: 0755
  files:
  - path: /etc/crictl.yaml
    filesystem: root
    mode: 0644
    contents:
      inline: |
        runtime-endpoint: unix:///run/containerd/containerd.sock
  - path: /etc/sysctl.d/13-fs_inotify.conf
    filesystem: root
    mode: 0644
    contents:
      inline: |
        fs.inotify.max_user_instances = 8192
        fs.inotify.max_user_watches = 524288
  - path: /etc/sysconfig/kubelet
    filesystem: root
    mode: 0644
    contents:
      inline: |
        KUBELET_EXTRA_ARGS=--pod-infra-container-image=${imageRepository}/pause:3.9
  - path: /etc/ssl/certs/internal-root-ca.pem
    filesystem: root
    mode: 0744
    contents:
      inline: |
        # PLACEHOLDER: add your organization root CA PEM (not distributed with this public repo).
        # Replace this block in a private fork, or use a patched overlay.
  - path: /etc/containerd/config.toml
    filesystem: root
    mode: 0744
    contents:
      inline: |
        version = 2

        imports = ["/etc/containerd/conf.d/*.toml"]

        [plugins]
          [plugins."io.containerd.grpc.v1.cri"]
            sandbox_image = "${imageRepository}/pause:3.9"
            device_ownership_from_security_context = true
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
            runtime_type = "io.containerd.runc.v2"
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
            SystemdCgroup = true
  - path: /etc/systemd/timesyncd.conf
    filesystem: root
    mode: 0744
    contents:
      inline: |
        [Time]
        NTP=pool.ntp.org
  - path: /etc/sysctl.d/10-oss_vm_map_max_count.conf
    filesystem: root
    mode: 0644
    contents:
      inline: |
        # Opensearch related requirements
        vm.max_map_count = 262144
  - path: /opt/set-hostname
    filesystem: root
    mode: 0744
    contents:
      inline: |
        #!/bin/sh
        set -x
        echo "$${COREOS_CUSTOM_HOSTNAME}" > /etc/hostname
        hostname "$${COREOS_CUSTOM_HOSTNAME}"
        echo "::1         ipv6-localhost ipv6-loopback" >/etc/hosts
        echo "127.0.0.1   localhost" >>/etc/hosts
        echo "127.0.0.1   $${COREOS_CUSTOM_HOSTNAME}" >>/etc/hosts
        echo "$${COREOS_CUSTOM_IP_ADDRESS} $${COREOS_CUSTOM_HOSTNAME}" >> /etc/hosts
  - path: /etc/multipath.conf
    mode: 0644
    filesystem: root
    contents:
      inline: |
        defaults {
          polling_interval 5
          checker_timeout 15
          find_multipaths yes
          user_friendly_names yes
        }
        devices {
          device {
            vendor                   DellEMC
            product                  Unity
            detect_prio              "yes"
            path_selector            "queue-length 0"
            path_grouping_policy     "group_by_prio"
            path_checker             tur
            failback                 immediate
            fast_io_fail_tmo         5
            no_path_retry            3
            rr_min_io_rq             1
            max_sectors_kb           1024
            dev_loss_tmo             10
          }
        }
systemd:
  units:
  - name: update-ca.service
    enabled: true
    contents: |
      [Unit]
      Description=Updates CA certificates
      After=nss-lookup.target
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshotq
      ExecStart=/sbin/update-ca-certificates
      [Install]
      WantedBy=multi-user.target
  - name: hack-netplan.service
    enabled: true
    contents: |
      [Unit]
      Description=Hack netplan config
      After=network-pre.target
      [Service]
      Type=oneshot
      ExecStart=/opt/hack.sh
      [Install]
      WantedBy=network-online.target
  - name: coreos-metadata.service
    contents: |
      [Unit]
      Description=Metadata agent
      After=nss-lookup.target
      After=network-online.target
      Wants=network-online.target
      ConditionPathExists=/etc/kubeadm.yml
      [Service]
      Type=oneshot
      Restart=on-failure
      RemainAfterExit=yes
      Environment=OUTPUT=/run/metadata/coreos
      ExecStartPre=/bin/sh -c "mount -L config-2 /mnt"
      ExecStart=/usr/bin/mkdir --parent /run/metadata
      ExecStart=/usr/bin/bash -c 'echo "COREOS_CUSTOM_HOSTNAME=$(jq -r .name /mnt/openstack/latest/meta_data.json)" > /run/metadata/coreos'
      ExecStart=/usr/bin/bash -c 'echo "COREOS_CUSTOM_IP_ADDRESS=$(ip addr show | awk '\''/inet / {print $2}'\'' | cut -d/ -f1 | grep -E '\''^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$'\'' | grep -v '\''127.0.0.1'\'' | head -n 1)" >> /run/metadata/coreos'
      ExecStart=/usr/bin/bash -c "sed -i \"s/BAREMETALHOST_UUID/$(jq -r .uuid /mnt/openstack/latest/meta_data.json)/\" /etc/kubeadm.yml"
      ExecStartPost=/bin/sh -c "umount /mnt"
      [Install]
      WantedBy=multi-user.target
  - name: set-hostname.service
    enabled: true
    contents: |
      [Unit]
      Description=Set the hostname for this machine
      Requires=coreos-metadata.service
      After=coreos-metadata.service
      ConditionPathExists=/etc/kubeadm.yml
      [Service]
      Type=oneshot
      EnvironmentFile=/run/metadata/coreos
      ExecStart=/opt/set-hostname
      [Install]
      WantedBy=multi-user.target
  - name: nvidia.service
    enabled: true
    contents: |
      [Unit]
      Description=NVIDIA Configure Service
      Wants=network-online.target
      After=network-online.target
      Before=containerd.target
      [Service]
      Type=oneshot
      RemainAfterExit=true
      Restart=on-failure
      RestartSec=10
      Environment=PATH=/opt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
      ExecStart=/opt/setup-nvidia
      ExecStartPre=/bin/sleep 10
      [Install]
      WantedBy=multi-user.target
  - name: nvidia-mig.service
    enabled: true
    contents: |
      [Unit]
      Description=NVIDIA MIG Configuration
      Wants=network-online.target
      After=network-online.target
      Requires=nvidia.service
      After=nvidia.service
      Before=containerd.target
      [Service]
      Type=oneshot
      RemainAfterExit=true
      Restart=on-failure
      RestartSec=10
      Environment=PATH=/opt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
      Environment=MIG_ENABLED=${nvidiaMigEnabled}
      ExecStart=/bin/sh -c 'if [ -x /opt/bin/nvidia-smi ]; then if [ "$MIG_ENABLED" -eq "true" ]; then /opt/bin/nvidia-smi -mig 1 && /opt/bin/nvidia-smi mig -cgi ${nvidiaMigConfig} -C; else /opt/bin/nvidia-smi -mig 0; fi; fi'
      [Install]
      WantedBy=multi-user.target
  - name: setup-nvidia-fabricmanager.service
    enabled: true
    contents: |
      [Unit]
      Description=NVIDIA Fabric Manager setup service
      Wants=network-online.target
      After=network-online.target
      Before=containerd.target
      Requires=nvidia-mig.service
      After=nvidia-mig.service
      [Service]
      Type=oneshot
      RemainAfterExit=true
      Restart=on-failure
      RestartSec=10
      Environment=PATH=/opt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
      ExecStart=/opt/setup-nvidia-fabricmanager
      [Install]
      WantedBy=multi-user.target
  - name: nvidia-runtime.service
    enabled: true
    contents: |
      [Unit]
      Description=NVIDIA Runtime download service
      Wants=network-online.target
      After=network-online.target
      Before=containerd.target
      Requires=setup-nvidia-fabricmanager.service
      After=setup-nvidia-fabricmanager.service
      ConditionPathExists=!/etc/extensions/nvidia_runtime.raw
      [Service]
      Type=oneshot
      RemainAfterExit=false
      Restart=on-failure
      RestartSec=10
      Environment=PATH=/opt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
      ExecStartPre=/bin/sh -c 'mkdir -p /opt/extensions/nvidia-runtime'
      ExecStart=/bin/sh -c 'curl ${artifactBaseUrl}/nvidia/runtime/${nvidiaRuntimeVersion}/nvidia-runtime-${nvidiaRuntimeVersion}-x86-64.raw -o /opt/extensions/nvidia-runtime/nvidia-runtime-${nvidiaRuntimeVersion}-x86-64.raw && ln -sf /opt/extensions/nvidia-runtime/nvidia-runtime-${nvidiaRuntimeVersion}-x86-64.raw /etc/extensions/nvidia_runtime.raw'
      ExecStartPost=/bin/sh -c '/bin/sleep 60 && /sbin/reboot'
      [Install]
      WantedBy=multi-user.target
  - name: multipathd.service
    enabled: true
  - name: kubeadm.service
    enabled: true
    dropins:
    - name: 10-flatcar.conf
      contents: |
        [Unit]
        # kubeadm must run after coreos-metadata populated /run/metadata directory.
        Requires=coreos-metadata.service
        Requires=update-ca.service
        After=coreos-metadata.service
        # kubeadm must run after containerd - see https://github.com/kubernetes-sigs/image-builder/issues/939.
        After=containerd.service
        After=update-ca.service
        [Service]
        # Make metadata environment variables available for pre-kubeadm commands.
        EnvironmentFile=/run/metadata/*
  - name: kubelet.service
    enabled: true
    contents: |
      [Unit]
      Description=kubelet: The Kubernetes Node Agent
      Wants=network-online.target
      After=network-online.target

      [Service]
      ExecStart=/opt/bin/kubelet
      Restart=always
      StartLimitInterval=0
      RestartSec=10

      [Install]
      WantedBy=multi-user.target
    dropins:
    - name: 10-kubeadm.conf
      contents: |
        [Service]
        Environment="KUBELET_KUBECONFIG_ARGS=--bootstrap-kubeconfig=/etc/kubernetes/bootstrap-kubelet.conf --kubeconfig=/etc/kubernetes/kubelet.conf"
        Environment="KUBELET_CONFIG_ARGS=--config=/var/lib/kubelet/config.yaml"
        # This is a file that "kubeadm init" and "kubeadm join" generate at runtime, populating
        # the KUBELET_KUBEADM_ARGS variable dynamically
        EnvironmentFile=-/var/lib/kubelet/kubeadm-flags.env
        # This is a file that the user can use for overrides of the kubelet args as a last resort. Preferably,
        # the user should use the .NodeRegistration.KubeletExtraArgs object in the configuration files instead.
        # KUBELET_EXTRA_ARGS should be sourced from this file.
        EnvironmentFile=-/etc/default/kubelet
        ExecStart=
        ExecStart=/opt/bin/kubelet $KUBELET_KUBECONFIG_ARGS $KUBELET_CONFIG_ARGS $KUBELET_KUBEADM_ARGS $KUBELET_EXTRA_ARGS
  - name: usr-libexec.mount
    enabled: true
    contents: |
      [Unit]
      Description=Kubernetes flex volume plugin directory

      [Mount]
      What=overlay
      Where=/usr/libexec
      Type=overlay
      Options=lowerdir=/usr/libexec,workdir=/opt/libexec.work,upperdir=/opt/libexec

      [Install]
      WantedBy=multi-user.target
  - name: containerd.service
    enabled: true
    contents: |
      [Unit]
      Description=containerd container runtime
      After=network.target local-fs.target

      [Service]
      ExecStartPre=-/sbin/modprobe overlay
      ExecStart=/bin/containerd

      Type=notify
      Delegate=yes
      KillMode=process
      Restart=always
      RestartSec=5
      LimitNPROC=infinity
      LimitCORE=infinity
      LimitNOFILE=infinity
      TaksMax=infinity
      OOMScoreAdjust=-999

      [Install]
      WantedBy=multi-user.target
    dropins:
    - name: 10-limitnofile.conf
      contents: |
        [Service]
        LimitNOFILE=1048576
