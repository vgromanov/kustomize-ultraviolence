apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VSphereDeploymentZone
metadata:
  name: ${clusterName}
  labels:
    infrastructure.cluster.x-k8s.io/failure-domain: north-${clusterName}
    topology.kubernetes.io/zone: north
spec:
  controlPlane: true
  server: ${vcServer}
  failureDomain: ${clusterName}
  placementConstraint:
    resourcePool: /SiteA-DC/host/SiteA-North-ESXi01/SiteA-North-Cluster01/Resources/north-${clusterName}
    folder: ${clusterName}
