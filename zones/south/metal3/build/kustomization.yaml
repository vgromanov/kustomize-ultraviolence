apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../_refs

transformers:
  - ../../_prefixes/md-zone
resources:
  - ippool.yaml
  - ../../../../nodes/metal3/groups/enp33-gpu
  - ../../../../nodes/metal3/groups/enp33-nongpu
  - ../../../../nodes/metal3/groups/ens81-gpu
  - ../../../../nodes/metal3/groups/ens81-nongpu
  - ../../../../nodes/metal3/groups/eno5eno6-gpu
  - ../../../../nodes/metal3/groups/eno5eno6-nongpu
patches:
  - target: { kind: MachineDeployment }
    patch: |
      - op: add
        path: /spec/template/metadata/labels/topology.kubernetes.io~1region
        value: sitea
      - op: add
        path: /spec/template/metadata/labels/topology.kubernetes.io~1zone
        value: south
