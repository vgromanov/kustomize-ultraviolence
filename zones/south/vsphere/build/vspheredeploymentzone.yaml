apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VSphereDeploymentZone
metadata:
  name: ${clusterName}
  labels:
    infrastructure.cluster.x-k8s.io/failure-domain: south-${clusterName}
    topology.kubernetes.io/zone: south
spec:
  controlPlane: true
  server: ${vcServer}
  failureDomain: ${clusterName}
  placementConstraint:
    resourcePool: /SiteA-DC/host/SiteA-South-ESXi01/SiteA-South-Cluster01/Resources/south-${clusterName}
    folder: ${clusterName}
