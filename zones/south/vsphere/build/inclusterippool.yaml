apiVersion: ipam.cluster.x-k8s.io/v1alpha2
kind: InClusterIPPool
metadata:
  name: ippool
  labels:
    infrastructure.cluster.x-k8s.io/failure-domain: south-${clusterName}
    topology.kubernetes.io/zone: south
spec:
  addresses:
    - ${ipPoolAddressesSouth}
  gateway: ${ipPoolGWSouth}
  prefix: ${ipPoolPrefixSouth}
