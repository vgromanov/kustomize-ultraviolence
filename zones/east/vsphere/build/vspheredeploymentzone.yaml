apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VSphereDeploymentZone
metadata:
  name: ${clusterName}
  labels:
    infrastructure.cluster.x-k8s.io/failure-domain: east-${clusterName}
    topology.kubernetes.io/zone: east
spec:
  controlPlane: true
  server: ${vcServer}
  failureDomain: ${clusterName}
  placementConstraint:
    resourcePool: /SiteA-DC/host/SiteA-East-ESXi01/SiteA-East-Cluster01/Resources/east-${clusterName}
    folder: ${clusterName}
