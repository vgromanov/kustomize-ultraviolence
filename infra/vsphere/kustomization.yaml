apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - vspherecluster.yaml
  - secret-vsphere.yaml

patches:
  - target:
      kind: Cluster
    path: patches/cluster.yaml
  - target:
      kind: VSphereCluster
    path: patches/vspherecluster.yaml
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
    path: patches/profile.yaml
