apiVersion: topology.clusters.local/v1alpha1
kind: ZoneTopology
metadata:
  name: east-zone-topology
  annotations: {}
spec:
  region: sitea
  zone: east
  groups:
    worker:
      replicas: 2
      vmCores: 2
      vmMemory: 4Gi
      flatcarContainerDisk: registry.example.com/org/kubevirt/containerdisks/flatcar:${flatcarVersion}
