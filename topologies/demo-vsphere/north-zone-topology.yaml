apiVersion: topology.clusters.local/v1alpha1
kind: ZoneTopology
metadata:
  name: north-zone-topology
  annotations: {}
spec:
  region: sitea
  zone: north
  ippool:
    addresses:
      - 198.51.100.0-198.51.100.5
    gateway: 198.51.100.1
    prefix: 24
  vcNetwork: APPMGMT-NORTH-V282
  groups:
    worker:
      replicas: 1
      vmtSpec:
        diskGiB: 64
        memoryMiB: 32768
        numCPUs: 8
        resourcePool: /SiteA-DC/host/SiteA-North-ESXi01/SiteA-North-Cluster01/Resources/north-${clusterName}
        template: capi-templates/north-flatcar-stable-3815.2.0-plain
        network:
          devices:
            - dhcp4: false
              addressesFromPools:
                - apiGroup: ipam.cluster.x-k8s.io
                  kind: InClusterIPPool
                  name: ippool
              networkName: APPMGMT-NORTH-V282
              nameservers:
                - 192.0.2.10
                - 192.0.2.11
                - 192.0.2.12
    ingress:
      replicas: 1
      vmtSpec:
        diskGiB: 64
        memoryMiB: 32768
        numCPUs: 8
        resourcePool: /SiteA-DC/host/SiteA-North-ESXi01/SiteA-North-Cluster01/Resources/north-${clusterName}
        template: capi-templates/north-flatcar-stable-3815.2.0-plain
        network:
          devices:
            - dhcp4: false
              addressesFromPools:
                - apiGroup: ipam.cluster.x-k8s.io
                  kind: InClusterIPPool
                  name: ippool
              networkName: APPMGMT-NORTH-V282
              nameservers:
                - 192.0.2.10
                - 192.0.2.11
                - 192.0.2.12
