apiVersion: topology.clusters.local/v1alpha1
kind: ZoneTopology
metadata:
  name: east-zone-topology
  annotations: {}
spec:
  region: sitea
  zone: east
  vcNetwork: ""
  ippool:
    dnsServers:
      - 192.0.2.10
      - 192.0.2.11
      - 192.0.2.12
    addresses:
      - 192.0.2.150-192.0.2.152
    gateway: 192.0.2.1
    prefix: "24"
    pools:
      - start: 192.0.2.150
        end: 192.0.2.152
        prefix: 24
        gateway: 192.0.2.1
