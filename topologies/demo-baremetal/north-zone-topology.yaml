apiVersion: topology.clusters.local/v1alpha1
kind: ZoneTopology
metadata:
  name: north-zone-topology
  annotations: {}
spec:
  region: sitea
  zone: north
  # Mirrors demo-vsphere shape so shared base/topology-replacements.yaml sources exist for Flux (path /base).
  vcNetwork: ""
  ippool:
    dnsServers:
      - 192.0.2.10
      - 192.0.2.11
      - 192.0.2.12
    addresses:
      - 198.51.100.0-198.51.100.31
    gateway: 198.51.100.1
    prefix: "24"
    pools:
      - start: 198.51.100.0
        end: 198.51.100.31
        prefix: 24
        gateway: 198.51.100.1
